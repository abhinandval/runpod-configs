# Local, credential-free tasks for the runpod-configs monorepo.
# Tasks intentionally validate source/configuration only; deployment and paid
# operations belong to project-specific, explicitly guarded scripts.

[tasks.python-check]
description = "Run Python tests and bytecode compilation"
run = [
  "cd serverless/qwen38-27b && PYTHONPATH=. python3 -m unittest discover -s tests -p 'test_*.py' -v",
  "cd serverless/qwen38-27b && python3 -m compileall -q .",
]

[tasks.shell-check]
description = "Validate shell script syntax"
run = "find . -type f -name '*.sh' -not -path './.git/*' -print0 | xargs -0 -r -n1 bash -n"

[tasks.docker-check]
description = "Validate Dockerfile syntax without building or pulling"
run = "docker build --check serverless/qwen38-27b"

[tasks.config-check]
description = "Parse the repository mise configuration"
run = "python3 -c 'import tomllib; tomllib.load(open(\"mise.toml\", \"rb\"))'"

[tasks.check]
description = "Run all local repository checks"
depends = ["config-check", "python-check", "shell-check", "docker-check"]
