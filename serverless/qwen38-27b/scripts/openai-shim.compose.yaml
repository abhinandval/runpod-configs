services:
  openai-shim:
    build:
      context: ..
      dockerfile: scripts/Dockerfile.openai-shim
    image: qwen38-openai-shim:local
    env_file:
      - .env.openai-shim
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
